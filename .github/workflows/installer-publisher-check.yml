name: Installer publisher checks

on:
  pull_request:
    paths:
      - ".github/scripts/publish-installers*"
      - ".github/release/publication.px"
      - ".github/workflows/publish-installers.yml"
      - ".github/workflows/installer-publisher-check.yml"
      - ".github/workflows/release.yml"
  push:
    branches: [main]
    paths:
      - ".github/scripts/publish-installers*"
      - ".github/release/publication.px"
      - ".github/workflows/publish-installers.yml"
      - ".github/workflows/installer-publisher-check.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test .github/scripts/publish-installers.test.mjs
