name: Tech Doc Writer

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.merged == true &&
      !contains(github.event.pull_request.title, '[docs]') &&
      !contains(github.event.pull_request.title, 'chore(docs)')
    steps:
      - name: Create doc update issue (unassigned)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.COPILOT_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNum = context.payload.pull_request.number;
            const prTitle = context.payload.pull_request.title;
            const mergeCommitSha = context.payload.pull_request.merge_commit_sha;

            // Get changed files via API — always matches the merged PR regardless of merge strategy
            // Uses pagination to handle PRs with more than 100 changed files
            const filePages = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: prNum, per_page: 100
            });
            const allFiles = filePages.map(f => f.filename);

            // Filter to source files (exclude CI, docs, config files)
            const isNonSourceFile = f =>
              f.startsWith('.github/') ||
              f === '.gitignore' ||
              f.startsWith('README') ||
              f.startsWith('CHANGELOG') ||
              f.startsWith('docs/') ||
              f.endsWith('.md') ||
              f.endsWith('.yml') ||
              f.endsWith('.json');
            const srcFiles = allFiles.filter(f => !isNonSourceFile(f));

            if (srcFiles.length === 0) {
              console.log('No source changes detected, skipping doc issue creation');
              return;
            }

            // Get diff via API using the PR number — immune to concurrent merges
            const diffRes = await github.request('GET /repos/{owner}/{repo}/pulls/{pull_number}', {
              owner, repo, pull_number: prNum,
              headers: { accept: 'application/vnd.github.v3.diff' }
            });
            const codeDiff = typeof diffRes.data === 'string' ? diffRes.data : '';

            // Dedup
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'documentation', per_page: 20
            });
            if (existing.data.some(i => i.title.includes(`PR #${prNum}`))) return;

            const changedFiles = allFiles.join('\n');

            const body = `## Documentation Update Required

            > ⚠️ **Do NOT assume existing docs are correct.** Verify all doc claims against the actual source code. Use merge commit \`${mergeCommitSha}\` as your source of truth.

            PR #${prNum} (\`${prTitle}\`) merged code changes.

            ### Changed Files
            \`\`\`
            ${changedFiles}
            \`\`\`

            ### Code Diff (truncated)
            \`\`\`diff
            ${codeDiff.substring(0, 3000)}
            \`\`\`

            ### Tasks
            - [ ] Review the diff and identify public API/behavior/config changes
            - [ ] Update README.md if usage changed
            - [ ] Update or create relevant docs/ files
            - [ ] Update CHANGELOG.md
            - [ ] Verify code examples against current source

            ---
            _Auto-generated by Tech Doc Writer (ADR-0005)_`;

            const issue = await github.rest.issues.create({
              owner, repo,
              title: `[docs] Update documentation for PR #${prNum}: ${prTitle}`,
              body,
              labels: ['documentation']
            });

            try {
              await github.request('PATCH /repos/{owner}/{repo}/issues/{issue_number}', {
                owner, repo, issue_number: issue.data.number, type: 'Task'
              });
            } catch (e) {}

            // Do NOT assign Copilot here — queue-advance handles assignment
            // to prevent race condition with simultaneous feature assignment
            console.log(`📝 Created doc issue #${issue.data.number} (unassigned, queue-advance will pick up)`);
