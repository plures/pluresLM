# Error pattern fixture for tests
# Used to validate YAML pattern loading and schema validation
name: error-capture
version: 1
description: "Capture CI failures and surface fixes from memory"

trigger:
  event: ci_failure
  conditions:
    - field: message
      matches: ".*error.*"

capture:
  content: "CI failure in {{repo}}: {{message}}"
  opts:
    category: error-fix
    tags:
      - "ci:failure"
      - "repo:{{repo}}"
    importance: 2.0

recall:
  min_similarity: 0.7
  limit: 3
  filter:
    categories:
      - error-fix

action:
  on_match:
    - log: "Found similar past failure: {{match.content}}"
  on_no_match:
    - log: "No similar past failure found — storing as new pattern"
