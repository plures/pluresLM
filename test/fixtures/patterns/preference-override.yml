# Preference override pattern fixture for tests
# Used to validate preference learning from human overrides
name: preference-override
version: "1.0"
description: "Learn from human overrides of automated decisions"

trigger:
  event: human_override
  pattern: ".*override.*"

capture:
  category: preference
  tags:
    - "preference:human-override"
    - "agent:{{agent_id}}"
  importance: 1.5

recall:
  similarity_threshold: 0.75
  limit: 1
  categories:
    - preference

actions:
  on_match:
    - apply_preference: "{{match.content}}"
  on_no_match:
    - use_default: true
